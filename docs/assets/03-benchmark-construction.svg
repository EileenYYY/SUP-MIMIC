<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">SUP-MIMIC benchmark construction</title>
  <desc id="desc">The benchmark construction pipeline creates BA, DDT, and DCT from a full feature table and disease-specific positive stay lists.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#355c7d"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #526675; }
      .head { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .body { font: 400 15px Arial, sans-serif; fill: #304554; }
      .small { font: 400 13px Arial, sans-serif; fill: #607482; }
      .box { stroke: #b7c7d3; stroke-width: 2; rx: 16; }
      .task { stroke-width: 2; rx: 16; }
      .arrow { stroke: #355c7d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="940" fill="#f5f8fc"/>
  <text x="70" y="70" class="title">SUP-MIMIC：BA / DDT / DCT 如何构建</text>
  <text x="70" y="105" class="subtitle">输入是本地授权环境中的特征表；输出文件默认仅用于本地评估</text>

  <rect x="80" y="170" width="300" height="170" class="box" fill="#e8f0f8"/>
  <text x="110" y="215" class="head">输入 A：all.csv</text>
  <text x="110" y="250" class="body">每行一个 stay / instance</text>
  <text x="110" y="278" class="body">subject_id, stay_id</text>
  <text x="110" y="306" class="body">结构化临床特征</text>

  <rect x="80" y="390" width="300" height="170" class="box" fill="#edf2fb"/>
  <text x="110" y="435" class="head">输入 B：疾病列表</text>
  <text x="110" y="470" class="body">Sepsis.csv</text>
  <text x="110" y="498" class="body">stay_id = positive stays</text>
  <text x="110" y="526" class="small">每种疾病一个文件</text>

  <rect x="500" y="250" width="360" height="300" class="box" fill="#f0edf9"/>
  <text x="535" y="300" class="head">预处理与筛选</text>
  <text x="535" y="340" class="body">1. 标记 diseased</text>
  <text x="535" y="375" class="body">2. 跨患者去重</text>
  <text x="535" y="410" class="body">3. 完整性阈值过滤</text>
  <text x="535" y="445" class="body">4. 数值化分类特征</text>
  <text x="535" y="480" class="body">5. Random Forest 选特征</text>
  <text x="535" y="520" class="small">默认 top-k=25，随机种子=42</text>

  <path d="M380 255 H490" class="arrow"/>
  <path d="M380 475 H455 V400 H490" class="arrow"/>

  <rect x="980" y="150" width="400" height="180" class="task" fill="#e8f5ee" stroke="#4d9a72"/>
  <text x="1020" y="198" class="head">BA：Basic Assessment</text>
  <text x="1020" y="238" class="body">选择若干阳性样本</text>
  <text x="1020" y="268" class="body">用于基础点式诊断评估</text>
  <text x="1020" y="302" class="small">A_class_basic_assessment.csv</text>

  <rect x="980" y="390" width="400" height="180" class="task" fill="#fff4dc" stroke="#d29a37"/>
  <text x="1020" y="438" class="head">DDT：Diagnostic Divergence</text>
  <text x="1020" y="478" class="body">标签不同，特征距离小</text>
  <text x="1020" y="508" class="body">每对包含阳性与阴性</text>
  <text x="1020" y="542" class="small">B_class_ddt_pairs.csv</text>

  <rect x="980" y="630" width="400" height="180" class="task" fill="#fbecef" stroke="#c86b6b"/>
  <text x="1020" y="678" class="head">DCT：Diagnostic Convergence</text>
  <text x="1020" y="718" class="body">标签相同，特征距离大</text>
  <text x="1020" y="748" class="body">每对都是阳性样本</text>
  <text x="1020" y="782" class="small">C_class_dct_pairs.csv</text>

  <path d="M860 315 H970" class="arrow"/>
  <path d="M860 400 H930 V480 H970" class="arrow"/>
  <path d="M860 485 H930 V720 H970" class="arrow"/>

  <rect x="220" y="690" width="560" height="100" class="box" fill="#eef7f7"/>
  <text x="255" y="730" class="head">发布边界</text>
  <text x="255" y="765" class="body">公开构建算法和合成样例；真实 BA/DDT/DCT 文件保留在授权环境</text>
</svg>
