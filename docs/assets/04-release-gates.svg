<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">SUP-MIMIC release gates</title>
  <desc id="desc">A release checklist with gates for code, data, secrets, figures, LLM governance, and arXiv source compilation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#355c7d"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #526675; }
      .head { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .body { font: 400 15px Arial, sans-serif; fill: #304554; }
      .small { font: 400 13px Arial, sans-serif; fill: #607482; }
      .gate { stroke-width: 2; rx: 16; }
      .arrow { stroke: #355c7d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f5f8fc"/>
  <text x="70" y="70" class="title">发布前六道闸门</text>
  <text x="70" y="105" class="subtitle">每一道都通过，才适合推送 GitHub 或上传 arXiv</text>

  <rect x="80" y="170" width="390" height="170" class="gate" fill="#e8f0f8" stroke="#6f99ba"/>
  <text x="115" y="215" class="head">Gate 1：代码完整</text>
  <text x="115" y="255" class="body">脚本、SQL、配置模板、测试</text>
  <text x="115" y="285" class="body">README 与复现命令可运行</text>
  <text x="115" y="315" class="small">python -m pytest</text>

  <rect x="555" y="170" width="390" height="170" class="gate" fill="#fff0f0" stroke="#c86b6b"/>
  <text x="590" y="215" class="head">Gate 2：数据隔离</text>
  <text x="590" y="255" class="body">无 MIMIC 原始表、病例 CSV</text>
  <text x="590" y="285" class="body">无患者级 prompt、响应、截图</text>
  <text x="590" y="315" class="small">真实结果只留本地</text>

  <rect x="1030" y="170" width="390" height="170" class="gate" fill="#fff4dc" stroke="#d29a37"/>
  <text x="1065" y="215" class="head">Gate 3：密钥清理</text>
  <text x="1065" y="255" class="body">API key / DSN / 密码</text>
  <text x="1065" y="285" class="body">全部改为环境变量或占位符</text>
  <text x="1065" y="315" class="small">qa_release_audit.py</text>

  <path d="M470 255 H545" class="arrow"/>
  <path d="M945 255 H1020" class="arrow"/>

  <rect x="80" y="470" width="390" height="170" class="gate" fill="#e8f5ee" stroke="#4d9a72"/>
  <text x="115" y="515" class="head">Gate 4：图表复核</text>
  <text x="115" y="555" class="body">只保留聚合图或合成图</text>
  <text x="115" y="585" class="body">移除病例截图与详细案例</text>
  <text x="115" y="615" class="small">图中不能出现 ID 或患者行</text>

  <rect x="555" y="470" width="390" height="170" class="gate" fill="#edf2fb" stroke="#6f85ba"/>
  <text x="590" y="515" class="head">Gate 5：LLM 治理</text>
  <text x="590" y="555" class="body">本地模型优先</text>
  <text x="590" y="585" class="body">API 需机构批准和零保留控制</text>
  <text x="590" y="615" class="small">不公开真实请求/响应日志</text>

  <rect x="1030" y="470" width="390" height="170" class="gate" fill="#f0edf9" stroke="#8e79b5"/>
  <text x="1065" y="515" class="head">Gate 6：arXiv 源码</text>
  <text x="1065" y="555" class="body">源文件、图片、bib 可编译</text>
  <text x="1065" y="585" class="body">不上传审稿回复和缓存</text>
  <text x="1065" y="615" class="small">pdflatex → bibtex → pdflatex</text>

  <path d="M275 340 V460" class="arrow"/>
  <path d="M750 340 V460" class="arrow"/>
  <path d="M1225 340 V460" class="arrow"/>

  <rect x="340" y="735" width="820" height="90" class="gate" fill="#17324d" stroke="#17324d"/>
  <text x="430" y="790" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">PASS → 可以公开代码包与论文</text>
</svg>
