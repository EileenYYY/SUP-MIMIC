base_url: "https://api.openai.com/v1/chat/completions"
model: "gpt-4o-mini"
api_key_env: "SUP_MIMIC_API_KEY"
temperature: 0.0
max_tokens: 600
timeout_seconds: 90
zero_data_retention_required: true
notes:
  - "Do not send MIMIC patient-level data to an API unless your institutional approval and the service terms permit it."
  - "For restricted data, prefer local models or an endpoint with explicit zero-retention/BAA-equivalent controls."
