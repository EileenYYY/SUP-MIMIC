database:
  dsn: postgresql://USER@HOST:5432/mimiciv
  schemas:
    hosp: mimiciv_hosp
    icu: mimiciv_icu
    derived: mimiciv_derived
    note: mimiciv_note

paths:
  sql_dir: sql
  output_dir: outputs
  raw_dir: outputs/raw
  case_dir: outputs/cases
  manifest_dir: outputs/manifests

defaults:
  # Runtime placeholders for authorized local runs.
  subject_id: 0
  hadm_id: 0
  stay_id: 0

jobs:
  - name: patients
    sql: sql/hospital/10_patients.sql
    output: outputs/raw/patients.jsonl
    format: jsonl
    params:
      subject_id: "{{subject_id}}"

  - name: admissions
    sql: sql/hospital/11_admissions.sql
    output: outputs/raw/admissions.jsonl
    format: jsonl
    params:
      subject_id: "{{subject_id}}"

  - name: icustays
    sql: sql/icu/20_icustays.sql
    output: outputs/raw/icustays.jsonl
    format: jsonl
    params:
      subject_id: "{{subject_id}}"

  - name: labs_first_day
    sql: sql/icu/22_first_day_labs.sql
    output: outputs/raw/first_day_labs.jsonl
    format: jsonl
    params:
      stay_id: "{{stay_id}}"

  - name: vitals_first_day
    sql: sql/icu/21_first_day_vitals.sql
    output: outputs/raw/first_day_vitals.jsonl
    format: jsonl
    params:
      stay_id: "{{stay_id}}"

  - name: diagnoses
    sql: sql/hospital/13_diagnoses.sql
    output: outputs/raw/diagnoses.jsonl
    format: jsonl
    params:
      hadm_id: "{{hadm_id}}"

  - name: procedures
    sql: sql/hospital/14_procedures.sql
    output: outputs/raw/procedures.jsonl
    format: jsonl
    params:
      hadm_id: "{{hadm_id}}"

  - name: prescriptions
    sql: sql/hospital/15_prescriptions.sql
    output: outputs/raw/prescriptions.jsonl
    format: jsonl
    params:
      hadm_id: "{{hadm_id}}"

screening:
  age_min: 18
  require_icu: true
  min_admissions: 1
  excluded_admission_types:
    - NEWBORN
  required_outputs:
    - patients
    - admissions
    - icustays

