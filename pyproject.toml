[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sup-mimic"
version = "0.1.0"
description = "Open-source reproduction kit for SUP-MIMIC."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SUP-MIMIC Contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1"
]
ml = [
  "scikit-learn>=1.3",
  "joblib>=1.3"
]
analysis = [
  "scipy>=1.10"
]
llm-api = [
  "requests>=2.31",
  "tqdm>=4.66"
]
llm-local = [
  "torch>=2.1",
  "transformers>=4.45",
  "accelerate>=0.30",
  "openpyxl>=3.1",
  "tqdm>=4.66"
]
all = [
  "psycopg[binary]>=3.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "scipy>=1.10",
  "requests>=2.31",
  "tqdm>=4.66",
  "openpyxl>=3.1"
]
dev = [
  "pytest>=8.0"
]

[project.scripts]
mimic-pipeline = "mimic_pipeline_kit.cli:main"
sup-mimic-pipeline = "mimic_pipeline_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
